name: CI/CD Pipeline & Docker Registry

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # =============================================================
  # 1. CONTINUOUS INTEGRATION: Automated Tests & Verification
  # =============================================================
  backend-test:
    name: Backend Tests (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        run: ./mvnw -B test

  frontend-test:
    name: Frontend Tests (Node 20 / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest Suite
        run: npm run test

      - name: Test Production Build
        run: npm run build

  # =============================================================
  # 2. DOCKER BUILD & PUSH: GitHub Container Registry (GHCR)
  # =============================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase repository string for Docker tag compliance
      - name: Lowercase image prefix
        id: image-prefix
        run: |
          echo "IMAGE_PREFIX=$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Backend Metadata & Build
      - name: Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.IMAGE_PREFIX }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Metadata & Build
      - name: Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.IMAGE_PREFIX }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================
  # 3. CONTINUOUS DEPLOYMENT: Auto-Deploy to VPS via SSH
  # =============================================================
  deploy-to-vps:
    name: Continuous Deployment to VPS
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS Secrets Configuration
        id: check-secrets
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USERNAME }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "VPS secrets found. Triggering automated deployment..."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "VPS secrets (VPS_HOST, VPS_USERNAME, VPS_SSH_KEY) not set. Skipping auto-deploy step."
            echo "Images are already pushed to GHCR and ready for manual pull on VPS!"
          fi

      - name: Checkout for compose template
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Deploy on VPS via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Directory on VPS where docker-compose.prod.yml resides
            APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/restaurant-erp' }}"
            mkdir -p $APP_DIR
            cd $APP_DIR

            # Log in to GHCR to pull packages
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull newly pushed images
            docker compose -f docker-compose.prod.yml pull

            # Recreate containers without downtime
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            # Clean up old unused images to save disk space
            docker image prune -af --filter "until=24h"

            echo "Deployment to VPS finished successfully!"
