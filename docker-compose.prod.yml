services:
  db:
    image: postgres:15-alpine
    container_name: food_erp_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_erp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeProdSecret123!}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-food_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port is kept private to docker network for database security
    # Uncomment if external access is strictly needed:
    # ports:
    #   - "127.0.0.1:5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - food_erp_prod_net

  backend:
    container_name: food_erp_backend_prod
    image: ${BACKEND_IMAGE:-ghcr.io/xenchinryu7/restaurant-erp/backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-food_erp}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeProdSecret123!}
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: postgres
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - food_erp_prod_net

  frontend:
    container_name: food_erp_frontend_prod
    image: ${FRONTEND_IMAGE:-ghcr.io/xenchinryu7/restaurant-erp/frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - food_erp_prod_net

volumes:
  pgdata_prod:
    name: food_erp_pgdata_prod

networks:
  food_erp_prod_net:
    name: food_erp_prod_net
